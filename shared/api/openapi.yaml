openapi: 3.1.0
info:
  title: Steady API
  version: 1.0.0
  description: |
    Backend for Steady (Phase 9, extended in Phase 12). Syncs the Plan, pairs a key
    holder who approves emergency unlocks, stores aggregate focus sessions, serves
    detector configs, verifies Play purchases and reports entitlements.

    Bearer tokens expire after 90 days without use (sliding: every authenticated
    request extends them). An expired token gets 401 `token_expired`; sign in again.
    Every response carries `X-Request-Id` (an incoming `X-Request-Id` of 8-64
    `[A-Za-z0-9._-]` is echoed).

    Privacy rule: every request body is validated strictly. Any field not listed in
    the schema is rejected with 400 `invalid_body`, so screen contents can never be
    stored. Sessions carry only times and counts.

    Errors always use the `Error` envelope `{error: {code, message}}`.
servers:
  - url: http://localhost:8787
    description: Local development
security:
  - bearer: []

paths:
  /v1/auth/otp/start:
    post:
      operationId: otpStart
      summary: Send a one-time code to a contact (email or phone)
      description: |
        Rate limited to 5 codes per contact per hour. Codes expire after 10 minutes.
        When the server runs with NODE_ENV=test the code is always "000000".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpStartRequest" }
      responses:
        "204": { description: Code sent }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The email/SMS provider failed (`otp_send_failed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No code sender configured on a production server (`otp_not_configured`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/otp/verify:
    post:
      operationId: otpVerify
      summary: Exchange a code for a bearer token
      description: |
        Creates the user on first sign-in. A code is single use and locks after 5 wrong attempts.
        Limited to 30 attempts per client IP per 15 minutes (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Code invalid, expired, used or locked (`invalid_code`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimitedVerify" }

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the calling token
      description: Other tokens of the same user (other devices) stay valid.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "204": { description: Token revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    delete:
      operationId: deleteMe
      summary: Erase the caller's account and all synced data
      description: |
        Deletes, in one transaction, the plan, sessions, unlock requests, invites,
        key-holder links in both directions, entitlements, verified purchases, one-time
        codes, every token and the user record. Unlock requests the caller decided for
        another owner are kept for that owner without the caller's id. Signing in again
        with the same contact creates a new, empty account.
      responses:
        "204": { description: Erased }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/plan:
    get:
      operationId: getPlan
      summary: Get the caller's Plan
      responses:
        "200":
          description: Stored plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putPlan
      summary: Replace the Plan with optimistic concurrency
      description: |
        `version` must equal the stored version + 1 (the first PUT must be version 1).
        Otherwise 409 with the current stored plan (or null if none is stored).
        `app:` surfaces may not target protected packages (com.android.settings,
        com.google.android.packageinstaller, com.android.packageinstaller, com.android.vending,
        com.google.android.dialer, com.android.phone, com.android.emergency, app.steady):
        400 `protected_app`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Plan" }
      responses:
        "200":
          description: Stored plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: Invalid JSON or body (`invalid_json`, `invalid_body`) or a protected app (`protected_app`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Version conflict (`version_conflict`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanConflict" }

  /v1/detectors:
    get:
      operationId: getDetectors
      summary: Current detector config (shared/detectors/detectors.v1.json)
      security: []
      responses:
        "200":
          description: Detector config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectorConfig" }
        "503":
          description: Config file unavailable (`detectors_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keyholder/invites:
    post:
      operationId: createInvite
      summary: Owner creates a single-use 6-character invite code (valid 24h)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/keyholder/invites/{code}/accept:
    post:
      operationId: acceptInvite
      summary: Another user accepts the invite and becomes the owner's key holder
      parameters:
        - name: code
          in: path
          required: true
          description: Invite code (case-insensitive)
          schema: { type: string, pattern: "^[A-Za-z0-9]{6}$" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteAccepted" }
        "400":
          description: Invalid body, or the owner tried to accept their own invite (`self_invite`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The owner is on the free tier and already has a key holder (`keyholder_limit`).
            The invite is not consumed, so it works once the owner upgrades or removes
            their current key holder. Re-accepting by the already-linked key holder is fine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Invite already used (`invite_used`) or expired (`invite_expired`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keyholder/links:
    get:
      operationId: listKeyholderLinks
      summary: Owner view — the caller's key holders
      responses:
        "200":
          description: Links, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeyholderLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/keyholder/owners:
    get:
      operationId: listKeyholderOwners
      summary: Key-holder view — owners whose key the caller holds
      responses:
        "200":
          description: Links, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/keyholder/links/{linkId}:
    delete:
      operationId: deleteKeyholderLink
      summary: Remove a key-holder link (owner or key holder)
      description: Pending unlock requests stay pending; new requests need a linked key holder.
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such link, or the caller is neither side of it (`not_found`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/keyholder/summary:
    get:
      operationId: keyholderWeeklySummary
      summary: An owner's weekly summary, for their linked key holder
      description: |
        Same body and rules as `GET /v1/summary/weekly`, for the owner `ownerUserId`.
        404 unless the caller is that owner's linked key holder (unknown and unlinked
        owners look the same).
      parameters:
        - name: ownerUserId
          in: query
          required: true
          schema: { type: string }
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: tz
          in: query
          required: false
          description: IANA time zone, e.g. Asia/Kolkata. Defaults to UTC.
          schema: { type: string, default: UTC }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklySummary" }
        "400":
          description: Missing ownerUserId, bad weekStart or tz (`invalid_query`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/keyholder/requests:
    get:
      operationId: listKeyholderRequests
      summary: Pending unlock requests from every owner the caller holds a key for
      responses:
        "200":
          description: Pending requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeyholderRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/unlock-requests:
    post:
      operationId: createUnlockRequest
      summary: Owner asks their key holder for an unlock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequestCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { const: pending }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: No key holder linked (`no_keyholder`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/unlock-requests/{id}:
    get:
      operationId: getUnlockRequest
      summary: Poll an unlock request (owner or linked key holder)
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      responses:
        "200":
          description: Request status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/unlock-requests/{id}/decision:
    post:
      operationId: decideUnlockRequest
      summary: Linked key holder approves or denies
      description: |
        On approval `until` = decision time + `minutes`. `minutes` defaults to the owner's
        `plan.unlockPolicy.approvalMinutes`, else 15; maximum 240.
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlockStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller is not the owner's linked key holder (`forbidden`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already decided (`already_decided`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sessions:
    post:
      operationId: postSession
      summary: Record an aggregate focus session (idempotent by id)
      description: Re-posting an id the caller already sent is a no-op (first write wins).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusSession" }
      responses:
        "204": { description: Stored (or already stored) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/summary/weekly:
    get:
      operationId: weeklySummary
      summary: Totals for the 7 days starting at weekStart
      description: |
        A session belongs to the local date its start falls on (in `tz`, default UTC).
        `focusMinutes` is the rounded total duration; `blocks` the number of sessions;
        `days` the sorted distinct dates that had at least one session.
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: tz
          in: query
          required: false
          description: IANA time zone, e.g. Asia/Kolkata. Defaults to UTC.
          schema: { type: string, default: UTC }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklySummary" }
        "400":
          description: Bad weekStart or tz (`invalid_query`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/entitlements:
    get:
      operationId: getEntitlements
      summary: The caller's tier and feature flags
      responses:
        "200":
          description: Entitlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlement" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/billing/verify:
    post:
      operationId: verifyPurchase
      summary: Verify a Google Play subscription purchase and upgrade to Plus
      description: |
        The server checks the token through its `PurchaseVerifier` (Google Play
        `purchases.subscriptionsv2.get` when configured). Without Play credentials a
        non-production server accepts tokens starting with `test-`; a production server
        answers 503 `billing_not_configured`. Re-verifying a token the caller already
        owns (restore) succeeds. Purchase tokens are stored hashed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingVerifyRequest" }
      responses:
        "200":
          description: Verified; the new entitlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlement" }
        "400":
          description: Invalid body (`invalid_body`) or the store rejected the purchase (`purchase_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The purchase token is already bound to another account (`purchase_in_use`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The store could not be reached (`billing_unavailable`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No verifier configured (`billing_not_configured`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token from POST /v1/auth/otp/verify.

  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid JSON (`invalid_json`) or body failed strict validation (`invalid_body`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token (`unauthorized`), or a token unused for 90 days (`token_expired`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests (`rate_limited`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimitedVerify:
      description: Too many verify attempts from this IP (`rate_limited`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Empty:
      type: object
      additionalProperties: false

    OtpStartRequest:
      type: object
      additionalProperties: false
      required: [contact]
      properties:
        contact: { type: string, minLength: 3, maxLength: 254, description: Email or phone; trimmed and lower-cased }

    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [contact, code]
      properties:
        contact: { type: string, minLength: 3, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: |
            Optional display name shown to key holders (additive to the contract). Without one,
            new users are shown as "Your friend"; nothing is derived from the contact.

    AuthToken:
      type: object
      additionalProperties: false
      required: [token, userId]
      properties:
        token: { type: string }
        userId: { type: string }

    Plan:
      $ref: "../schema/plan.schema.json"

    PlanConflict:
      type: object
      required: [error, current]
      properties:
        error: { $ref: "#/components/schemas/Error/properties/error" }
        current:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/Plan" }

    Matcher:
      type: object
      additionalProperties: false
      properties:
        viewIdEquals: { type: string }
        viewIdEndsWith: { type: string }
        textEquals: { type: string }
        descContains: { type: string }
        classEquals: { type: string }
        selected: { type: boolean }

    DetectorConfig:
      type: object
      required: [version, detectors]
      properties:
        version: { type: integer }
        detectors:
          type: array
          items:
            type: object
            required: [surfaceId, packageName, anyOf]
            properties:
              surfaceId: { type: string }
              packageName: { type: string }
              anyOf:
                type: array
                items: { $ref: "#/components/schemas/Matcher" }
              anchor: { $ref: "#/components/schemas/Matcher" }

    Invite:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code: { type: string, pattern: "^[A-HJ-NP-Z2-9]{6}$" }
        expiresAt: { type: string, format: date-time }

    InviteAccepted:
      type: object
      additionalProperties: false
      required: [ownerUserId, ownerName]
      properties:
        ownerUserId: { type: string }
        ownerName: { type: string }

    SurfaceId:
      type: string
      pattern: "^(instagram\\.reels|youtube\\.shorts|snapchat\\.spotlight|facebook\\.reels|app:[A-Za-z0-9._]+|site:[a-z0-9.-]+)$"

    UnlockRequestCreate:
      type: object
      additionalProperties: false
      required: [surfaceId, reason]
      properties:
        surfaceId:
          description: Surface to unlock, or null for everything
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/SurfaceId" }
        reason: { type: string, minLength: 1, maxLength: 280 }

    UnlockStatus:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string }
        status: { enum: [pending, approved, denied] }
        until: { type: string, format: date-time, description: Present only when approved }

    KeyholderRequest:
      type: object
      additionalProperties: false
      required: [id, ownerName, reason, surfaceId, createdAt]
      properties:
        id: { type: string }
        ownerName: { type: string }
        reason: { type: string }
        surfaceId:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/SurfaceId" }
        createdAt: { type: string, format: date-time }

    Decision:
      type: object
      additionalProperties: false
      required: [approve]
      properties:
        approve: { type: boolean }
        minutes: { type: integer, minimum: 1, maximum: 240 }

    FocusSession:
      type: object
      additionalProperties: false
      required: [id, scheduleId, start, end, intercepts, unlocks]
      description: Aggregate only. `end` must not be before `start`.
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        scheduleId:
          oneOf:
            - { type: "null" }
            - { type: string, minLength: 1, maxLength: 100 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        intercepts: { type: integer, minimum: 0 }
        unlocks: { type: integer, minimum: 0 }

    WeeklySummary:
      type: object
      additionalProperties: false
      required: [focusMinutes, blocks, intercepts, unlocks, days]
      properties:
        focusMinutes: { type: integer, minimum: 0 }
        blocks: { type: integer, minimum: 0 }
        intercepts: { type: integer, minimum: 0 }
        unlocks: { type: integer, minimum: 0 }
        days:
          type: array
          items: { type: string, format: date }

    Entitlement:
      type: object
      additionalProperties: false
      required: [tier, features]
      properties:
        tier: { enum: [free, plus] }
        features:
          type: array
          items:
            enum: [unlimited_schedules, desktop_sync, notes_to_cards, task_breakdown]

    KeyholderLink:
      type: object
      additionalProperties: false
      required: [linkId, keyHolderUserId, keyHolderName, createdAt]
      properties:
        linkId: { type: string }
        keyHolderUserId: { type: string }
        keyHolderName: { type: string }
        createdAt: { type: string, format: date-time }

    OwnerLink:
      type: object
      additionalProperties: false
      required: [linkId, ownerUserId, ownerName, createdAt]
      properties:
        linkId: { type: string }
        ownerUserId: { type: string }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }

    BillingVerifyRequest:
      type: object
      additionalProperties: false
      required: [productId, purchaseToken]
      properties:
        productId: { enum: [steady_plus_monthly, steady_plus_yearly] }
        purchaseToken: { type: string, minLength: 1, maxLength: 4096 }
